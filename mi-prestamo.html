<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>BTCash — Mi Préstamo | btcash.com.ar</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-glass-base:  #F4F6F9;
      --glass-white:    rgba(255, 255, 255, 0.75);
      --glass-border:   rgba(255, 255, 255, 0.8);
      --glass-shadow:   0 8px 32px 0 rgba(31, 38, 135, 0.05);
      
      --accent:         #D97706; /* Ámbar/Bitcoin suave mate */
      --accent-hover:   #B45309;
      --accent-soft:    rgba(217, 119, 6, 0.08);
      
      --text-main:      #1E293B;
      --text-muted:     #64748B;
      
      --green-ok:       #059669;
      --green-bg:       rgba(5, 150, 105, 0.06);
      --yellow-bg:      rgba(217, 119, 6, 0.06);
      --red-bg:         rgba(225, 29, 72, 0.06);
      --blue-ok:        #2563EB;
      --blue-bg:        rgba(37, 99, 235, 0.06);
      --card-bg:        rgba(255, 255, 255, 0.85);
      --input-bg:       rgba(255, 255, 255, 0.9);
      --border-color:   rgba(226, 232, 240, 0.8);
    }

    body.dark {
      --bg-glass-base:  #0F172A;
      --text-main:      #F8FAFC;
      --text-muted:     #94A3B8;
      --card-bg:        rgba(30, 41, 59, 0.75);
      --glass-white:    rgba(30, 41, 59, 0.75);
      --glass-border:   rgba(255, 255, 255, 0.1);
      --input-bg:       rgba(15, 23, 42, 0.6);
      --border-color:   rgba(51, 65, 85, 0.8);
      --green-bg:       rgba(5, 150, 105, 0.2);
      --yellow-bg:      rgba(217, 119, 6, 0.2);
      --red-bg:         rgba(225, 29, 72, 0.2);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(135deg, #F8FAFC 0%, #EEF2F6 100%); 
      color: var(--text-main); 
      font-size: 15px; 
      line-height: 1.7; 
      min-height: 100vh;
      overflow-x: hidden; 
      -webkit-font-smoothing: antialiased; 
      transition: background 0.3s, color 0.3s;
    }
    body.dark {
      background: linear-gradient(135deg, #0F172A 0%, #020617 100%);
    }
    a { text-decoration: none; }

    /* ── LOGO ────────────────────────────────────── */
    .logo-b { display: inline-flex; align-items: baseline; gap: 0; line-height: 1; }
    .logo-b .l-btc { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; color: var(--accent); letter-spacing: -.02em; font-size: 24px; }
    .logo-b .l-cash { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; color: var(--text-main); letter-spacing: -.02em; font-size: 20px; }
    .logo-b .l-domain { font-family: 'Inter', sans-serif; font-weight: 400; color: var(--text-muted); margin-left: 4px; letter-spacing: .02em; font-size: 10px; }

    /* ── NAV TOPBAR ──────────────────────────────── */
    nav {
      position: sticky; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 70px;
      background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color); transition: all .3s;
    }
    body.dark nav { background: rgba(15, 23, 42, 0.75); }
    nav.scrolled { box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
    
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .nav-tag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
    
    .dm-wrap { display: flex; align-items: center; gap: 8px; }
    .dm-wrap label { font-size: 12px; color: var(--text-muted); cursor: pointer; font-weight: 500; }
    .sw { position: relative; display: inline-block; width: 38px; height: 21px; flex-shrink: 0; }
    .sw input { display: none; }
    .sw-sl { position: absolute; cursor: pointer; inset: 0; background: rgba(226, 232, 240, 0.8); transition: .3s; border-radius: 21px; border: 1px solid var(--border-color); }
    body.dark .sw-sl { background: rgba(51, 65, 85, 0.8); }
    .sw-sl:before { position: absolute; content: ""; height: 15px; width: 15px; left: 2px; bottom: 2px; background: var(--text-main); transition: .3s; border-radius: 50%; }
    input:checked + .sw-sl { background: var(--accent); border-color: var(--accent); }
    input:checked + .sw-sl:before { transform: translateX(17px); background: #FFFFFF; }

    /* ── BOTONES FLOTANTES REDISEÑADOS ────────────── */
    .floating-contact {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .floating-contact a {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }
    .floating-contact a:hover {
      transform: translateY(-3px) scale(1.08);
    }
    
    .floating-whatsapp {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #FFFFFF;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .floating-whatsapp:hover {
      box-shadow: 0 10px 28px rgba(37, 211, 102, 0.55);
    }

    .floating-telegram {
      background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
      color: #FFFFFF;
      box-shadow: 0 6px 20px rgba(42, 171, 238, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .floating-telegram:hover {
      box-shadow: 0 10px 28px rgba(42, 171, 238, 0.55);
    }

    .floating-contact svg {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    /* ── MAIN CONTAINER ──────────────────────────── */
    .main { max-width: 1060px; margin: 0 auto; padding: 40px 24px 64px; }

    /* ── BUSCADOR DE PRÉSTAMO ───────────────────── */
    .search-wrap { max-width: 480px; margin: 60px auto 0; text-align: center; }
    .search-wrap h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(28px, 5vw, 38px); font-weight: 700; color: var(--text-main); margin-bottom: 10px; letter-spacing: -.02em; line-height: 1.2; }
    .search-wrap h1 em { font-style: normal; color: var(--accent); }
    .search-wrap p { font-size: 15px; color: var(--text-muted); margin-bottom: 28px; font-weight: 400; }
    
    .search-box {
      display: flex; gap: 10px;
      background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-radius: 16px; padding: 8px 8px 8px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03); transition: all .2s;
    }
    .search-box:focus-within { border-color: var(--accent); box-shadow: 0 12px 32px rgba(217, 119, 6, 0.1); }
    .search-box input {
      flex: 1; min-width: 0; background: transparent; border: none;
      color: var(--text-main); font-size: 15px; font-family: 'Inter', sans-serif; font-weight: 600; outline: none;
    }
    .search-box input::placeholder { color: var(--text-muted); font-weight: 400; }
    
    .btn-primary { 
      background: var(--accent); color: #FFFFFF; border: none; border-radius: 12px; padding: 12px 22px; 
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; 
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all .2s; 
      box-shadow: 0 4px 16px rgba(217, 119, 6, 0.25); white-space: nowrap;
    }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(217, 119, 6, 0.35); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .status-msg { margin-top: 16px; font-size: 14px; }
    .err { color: #E11D48; background: var(--red-bg); border: 1px solid rgba(225, 29, 72, 0.2); border-radius: 12px; padding: 12px 16px; text-align: left; font-size: 13px; font-weight: 500; }

    /* ── ALERTAS Y BANNERS ───────────────────────── */
    .alert-banner {
      display: flex; align-items: flex-start; gap: 14px;
      border-radius: 18px; padding: 16px 20px; margin-bottom: 24px;
      border: 1px solid transparent; backdrop-filter: blur(12px);
      animation: fadeUp .4s ease both;
    }
    .alert-banner.warning { background: var(--yellow-bg); border-color: rgba(217, 119, 6, 0.3); color: #B45309; }
    body.dark .alert-banner.warning { color: #FBBF24; }
    .alert-banner.danger { background: var(--red-bg); border-color: rgba(225, 29, 72, 0.3); color: #E11D48; animation: fadeUp .4s ease both, alertPulse 2.5s ease-in-out infinite; }
    @keyframes alertPulse { 0%,100%{box-shadow: 0 0 0 0 rgba(225, 29, 72, 0)} 50%{box-shadow: 0 0 0 6px rgba(225, 29, 72, 0.15)} }
    .alert-icon { font-size: 20px; flex-shrink: 0; line-height: 1; }
    .alert-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    .alert-desc { font-size: 13px; opacity: .9; font-weight: 400; line-height: 1.6; }

    /* ── HEADER DEL PRÉSTAMO ──────────────────────── */
    .loan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
    .client-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .client-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); flex-shrink: 0; }
    .client-name { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 700; color: var(--text-main); letter-spacing: -.02em; }
    
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--card-bg); border: 1px solid var(--border-color); backdrop-filter: blur(8px);
      border-radius: 12px; padding: 7px 14px; font-size: 12px; font-weight: 600; color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif; transition: all .2s; text-decoration: none;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

    /* Estilos específicos para la Chip de Dirección BTC y Botón Copiar */
    .btc-address-chip {
      font-family: 'Inter', monospace;
      font-size: 11px;
      letter-spacing: -0.01em;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-copy {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .btn-copy:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }
    
    .close-x {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 8px 14px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif; transition: all .2s;
    }
    .close-x:hover { border-color: #E11D48; color: #E11D48; }

    /* ── DASHBOARD GRID & CARDS ──────────────────── */
    .loan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .loan-col { display: flex; flex-direction: column; gap: 24px; }

    .card {
      background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-radius: 24px; padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.02); transition: all .3s;
    }
    .card:hover { box-shadow: 0 15px 35px rgba(0,0,0,0.04); }
    .card-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; }

    /* KPIs */
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .kpi { background: rgba(255, 255, 255, 0.5); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; transition: all .2s; }
    body.dark .kpi { background: rgba(15, 23, 42, 0.4); }
    .kpi .kl { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
    .kpi .kv { font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(18px, 3.5vw, 22px); font-weight: 700; color: var(--text-main); word-break: break-word; }
    .kpi .ks { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

    /* BARRAS DE PROGRESO */
    .prog-wrap { margin-top: 18px; background: rgba(255, 255, 255, 0.5); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; }
    body.dark .prog-wrap { background: rgba(15, 23, 42, 0.4); }
    .prog-label { font-size: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 10px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; font-family: 'Plus Jakarta Sans', sans-serif; }
    .prog-bg { background: rgba(226, 232, 240, 0.6); border-radius: 8px; height: 12px; overflow: hidden; position: relative; }
    body.dark .prog-bg { background: rgba(51, 65, 85, 0.6); }
    .prog-fill { height: 100%; background: var(--accent); border-radius: 8px; width: 0%; transition: width 1.2s cubic-bezier(.25,.46,.45,.94); }
    
    .badges-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .badge { background: rgba(255, 255, 255, 0.6); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px; border-radius: 100px; font-size: 11px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; }
    body.dark .badge { background: rgba(15, 23, 42, 0.5); }
    .badge.right { margin-left: auto; }

    /* TABLA HISTORIAL */
    .table-wrap { max-height: 280px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 16px; margin-top: 8px; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
    thead th { background: rgba(255, 255, 255, 0.8); color: var(--text-main); text-align: left; padding: 12px 14px; font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1; font-family: 'Plus Jakarta Sans', sans-serif; }
    body.dark thead th { background: rgba(30, 41, 59, 0.9); }
    tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border-color); color: var(--text-main); vertical-align: middle; font-size: 13px; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.4); }
    body.dark tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
    .td-muted { color: var(--text-muted); font-size: 11px; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 36px 16px; gap: 10px; text-align: center; }
    .empty-state .empty-title { font-size: 14px; font-weight: 600; color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; }
    .empty-state .empty-sub { font-size: 12px; color: var(--text-muted); max-width: 240px; line-height: 1.6; }

    /* BADGE RIESGO & BITCOIN CARDS */
    .risk-badge {
      grid-column: span 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; text-align: center; border-radius: 16px; padding: 16px 20px;
      border: 1px solid var(--border-color); background: rgba(255, 255, 255, 0.5);
    }
    body.dark .risk-badge { background: rgba(15, 23, 42, 0.4); }
    .risk-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; }
    .risk-badge .risk-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700; color: var(--text-main); }
    .risk-badge .risk-sub { font-size: 11px; font-weight: 400; color: var(--text-muted); line-height: 1.5; max-width: 280px; }
    .risk-dot.safe { background: var(--green-ok); box-shadow: 0 0 0 3px var(--green-bg); }
    .risk-dot.warning { background: var(--accent); box-shadow: 0 0 0 3px var(--yellow-bg); }
    .risk-dot.danger { background: #E11D48; box-shadow: 0 0 0 3px var(--red-bg); animation: dotPulse 2s ease-in-out infinite; }
    @keyframes dotPulse { 0%,100%{box-shadow: 0 0 0 3px var(--red-bg)} 50%{box-shadow: 0 0 0 6px rgba(225, 29, 72, 0.1)} }

    .btc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    .btc-card { background: rgba(255, 255, 255, 0.5); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; text-align: center; transition: all .2s; }
    body.dark .btc-card { background: rgba(15, 23, 42, 0.4); }
    .btc-card.full { grid-column: span 2; }
    .btc-card .bl { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .btc-card .bv { font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(14px, 2.8vw, 17px); font-weight: 700; color: var(--text-main); word-break: break-word; }
    .btc-card.live { background: rgba(255, 255, 255, 0.85); border-color: rgba(5, 150, 105, 0.3); }
    body.dark .btc-card.live { background: rgba(15, 23, 42, 0.8); }
    .btc-card.live .bv { font-size: clamp(18px, 3.5vw, 22px); color: var(--green-ok); }

    .c-green { color: var(--green-ok) !important; }
    .c-yellow { color: var(--accent) !important; }
    .c-red { color: #E11D48 !important; }
    
    .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; animation: liveBlink 2s ease-in-out infinite; }
    .live-dot.green { background: var(--green-ok); }
    .live-dot.yellow { background: var(--accent); }
    .live-dot.red { background: #E11D48; }
    @keyframes liveBlink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* SPARKLINE CHART */
    .sparkline-card { margin-top: 24px; }
    .sparkline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .sparkline-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .12em; display: flex; align-items: center; gap: 6px; }
    .sparkline-legend { display: flex; gap: 16px; }
    .spark-leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .spark-leg-line { width: 14px; height: 2px; border-radius: 2px; }
    .spark-svg { width: 100%; overflow: visible; display: block; }
    .spark-loading { font-size: 12px; color: var(--text-muted); text-align: center; padding: 28px 0; font-weight: 500; }

    /* TOOLTIPS */
    .tip-wrap { position: relative; display: inline-flex; align-items: center; }
    .tip-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 50%; background: rgba(226, 232, 240, 0.8); color: var(--text-muted);
      font-size: 9px; font-weight: 700; cursor: default; transition: all .15s; flex-shrink: 0; line-height: 1; font-style: normal;
    }
    body.dark .tip-icon { background: rgba(51, 65, 85, 0.8); }
    .tip-wrap:hover .tip-icon { background: var(--accent); color: #FFFFFF; }
    .tip-box {
      position: absolute; z-index: 200; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(4px);
      background: var(--text-main); color: var(--bg-glass-base); font-size: 11px; font-weight: 500; line-height: 1.5;
      padding: 8px 12px; border-radius: 10px; width: 210px; text-align: left;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15); pointer-events: none; opacity: 0; visibility: hidden;
      transition: all .18s; white-space: normal; font-family: 'Inter', sans-serif;
    }
    .tip-box::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--text-main); }
    .tip-wrap.tip-right .tip-box { left: 0; transform: translateX(0) translateY(4px); }
    .tip-wrap.tip-right .tip-box::after { left: 10px; transform: none; }
    .tip-wrap.tip-right:hover .tip-box { transform: translateX(0) translateY(0); }
    .tip-wrap.tip-left .tip-box { left: auto; right: 0; transform: translateX(0) translateY(4px); }
    .tip-wrap.tip-left .tip-box::after { left: auto; right: 10px; transform: none; }
    .tip-wrap.tip-left:hover .tip-box { transform: translateX(0) translateY(0); }
    .tip-wrap:hover .tip-box { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

    /* ANIMACIONES */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .card-anim { animation: fadeUp .5s ease both; }

    /* ── RESPONSIVE / MOBILE OPTIMIZATIONS ───────── */

  <script>
    // ⚠️ REEMPLAZAR CON TU URL DE APPS SCRIPT SI USAS HOSTING ESTÁTICO
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7hNpmyth9Nvyh4XMc0K_ZxDc0VFA4CT-Ox5Fv7fspGxuIDScYi4s2Vaq33t3r5lM/exec";

    // LÓGICA DE RATE LIMITING (Límite de intentos local)
    const MAX_ATTEMPTS = 5;
    const TIME_WINDOW_MS = 60000; // 1 minuto
    const BLOCK_DURATION_MS = 120000; // 2 minutos de bloqueo
    
    function checkRateLimit() {
      const now = Date.now();
      let attemptsData = JSON.parse(localStorage.getItem('loan_search_attempts') || '{"attempts":[], "blockedUntil":0}');

      if (now < attemptsData.blockedUntil) {
        const remainingSec = Math.ceil((attemptsData.blockedUntil - now) / 1000);
        return { allowed: false, message: `Demasiados intentos. Por favor esperá ${remainingSec} segundos.` };
      }

      // Filtrar intentos dentro de la ventana de tiempo
      attemptsData.attempts = attemptsData.attempts.filter(timestamp => now - timestamp < TIME_WINDOW_MS);

      if (attemptsData.attempts.length >= MAX_ATTEMPTS) {
        attemptsData.blockedUntil = now + BLOCK_DURATION_MS;
        localStorage.setItem('loan_search_attempts', JSON.stringify(attemptsData));
        return { allowed: false, message: `Límite de intentos superado. Bloqueado por 2 minutos.` };
      }

      // Registrar nuevo intento
      attemptsData.attempts.push(now);
      localStorage.setItem('loan_search_attempts', JSON.stringify(attemptsData));
      return { allowed: true };
    }

    function tip(text, pos) {
      var cls = 'tip-wrap' + (pos ? ' ' + pos : '');
      return '<span class="' + cls + '"><span class="tip-icon">i</span><span class="tip-box">' + text + '</span></span>';
    }

    // Copiar dirección al portapapeles
    function copyToClipboard(text, btnEl) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnEl.innerHTML;
        btnEl.innerHTML = '✓ ¡Copiado!';
        btnEl.style.color = 'var(--green-ok)';
        setTimeout(() => {
          btnEl.innerHTML = originalText;
          btnEl.style.color = '';
        }, 2000);
      }).catch(err => {
        console.error('Error al copiar: ', err);
      });
    }

    document.getElementById('dmSw').addEventListener('change', e => {
      document.body.classList.toggle('dark', e.target.checked);
    });

    window.addEventListener('scroll', () => {
      document.getElementById('topnav').classList.toggle('scrolled', window.scrollY > 10);
    });

    function fmt(n) { n = parseFloat(n) || 0; return '$' + n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD'; }
    function normPct(v) { let x = Number(v) || 0; if (x <= 1) x *= 100; return Math.max(0, Math.min(100, x)); }
    function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    async function searchLoan() {
      // Aplicar verificación de Rate Limiting
      const limitCheck = checkRateLimit();
      const msg = document.getElementById('statusMsg');
      const btn = document.getElementById('btnSearch');

      if (!limitCheck.allowed) {
        msg.innerHTML = '<div class="err">' + limitCheck.message + '</div>';
        return;
      }

      const code = document.getElementById('loanCode').value.trim();
      if (!code) { msg.innerHTML = '<div class="err">Por favor ingresá un código de préstamo válido.</div>'; return; }

      msg.innerHTML = '<span style="color:var(--text-muted);font-size:13px;font-weight:500;">Cargando datos del préstamo...</span>';
      btn.disabled = true;

      // 1. Detección automática de entorno Google Apps Script
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(r => { btn.disabled = false; renderLoan(r); })
          .withFailureHandler(e => { btn.disabled = false; msg.innerHTML = '<div class="err">Error: ' + (e && e.message ? e.message : e) + '</div>'; })
          .getLoanAndPayments(code);
      } else {
        // 2. Entorno Web Estático vía fetch()
        try {
          const response = await fetch(`${APPS_SCRIPT_URL}?code=${encodeURIComponent(code)}`);
          const result = await response.json();
          btn.disabled = false;

          if (result.status === 'success') {
            renderLoan(result.data);
          } else {
            msg.innerHTML = '<div class="err">' + (result.message || 'Préstamo no encontrado.') + '</div>';
          }
        } catch (error) {
          btn.disabled = false;
          msg.innerHTML = '<div class="err">Error al conectar con el servidor. Verifique su conexión.</div>';
        }
      }
    }

    document.getElementById('loanCode').addEventListener('keydown', e => { if (e.key === 'Enter') searchLoan(); });

    function renderLoan(res) {
      const msg = document.getElementById('statusMsg');
      if (!res || !res.loan) { msg.innerHTML = '<div class="err">Préstamo no encontrado. Verificá el código ingresado.</div>'; return; }
      document.getElementById('searchScreen').style.display = 'none';
      msg.innerHTML = '';
      window._lastLoan = res;

      const L = res.loan, C = res.computed;
      const P = (res.payments || []).sort((a, b) => new Date(b.DateISO) - new Date(a.DateISO));
      const pct = normPct(L.Payment_Progress_Percent).toFixed(1);

      const live = Number(L.BTC_Price_RealTime_USD) || 0;
      const warn = Number(L.BTC_Warning_Price_USD) || 0;
      const liq = Number(L.BTC_Sell_Threshold_USD) || 0;
      let liveClass = 'c-green', dotClass = 'green', semLabel = 'Al día';
      if (live <= warn && live > liq) { liveClass = 'c-yellow'; dotClass = 'yellow'; semLabel = 'Advertencia'; }
      if (live <= liq) { liveClass = 'c-red'; dotClass = 'red'; semLabel = 'Liquidación'; }

      const result = document.getElementById('loanResult');
      result.style.display = 'block';
      var H = [];

      /* BANNER ALERTA */
      if (live <= liq) {
        H.push('<div class="alert-banner danger"><div class="alert-icon">🚨</div><div class="alert-body">');
        H.push('<div class="alert-title">Atención: Zona de liquidación</div>');
        H.push('<div class="alert-desc">El precio actual de BTC (' + fmt(live) + ') cayó por debajo del precio de liquidación (' + fmt(liq) + '). Contactá a BTCash urgentemente.</div>');
        H.push('</div></div>');
      } else if (live <= warn) {
        H.push('<div class="alert-banner warning"><div class="alert-icon">⚠️</div><div class="alert-body">');
        H.push('<div class="alert-title">Aviso: Zona de advertencia</div>');
        H.push('<div class="alert-desc">El precio de BTC (' + fmt(live) + ') se encuentra cerca del umbral límite (' + fmt(liq) + '). Recomendamos monitorear la garantía.</div>');
        H.push('</div></div>');
      }

      /* HEADER PRÉSTAMO */
      H.push('<div class="loan-header card-anim" style="animation-delay:.05s">');
      H.push('<div class="client-row">');
      H.push('<img class="client-avatar" src="https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/LatGL1sf4VN9iHEDGn9X/pub/1B2aQ4bNdBQvQxAgdOVo/asdsadsad.png" alt="Cliente">');
      H.push('<span class="client-name">' + esc(L.Client_name || 'Cliente') + '</span>');
      H.push('<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">');
      if (L.Contract_PDF) H.push('<a class="chip" href="' + encodeURI(L.Contract_PDF) + '" target="_blank">📄 Ver Contrato</a>');
      
      /* Dirección de BTC completa linkeada a mempool.space + Botón de copiar */
      if (L.BTC_Adress) {
        const fullAddress = esc(L.BTC_Adress);
        H.push('<div class="chip" style="gap:4px;">');
        H.push('<span>🟠</span>');
        H.push('<a href="https://mempool.space/es/address/' + encodeURIComponent(L.BTC_Adress) + '" target="_blank" class="btc-address-chip" title="' + fullAddress + '">' + fullAddress + '</a>');
        H.push('<button class="btn-copy" onclick="copyToClipboard(\'' + fullAddress + '\', this)" title="Copiar dirección">📋 Copiar</button>');
        H.push('</div>');
      }

      H.push('</div></div>');
      H.push('<button class="close-x" onclick="resetView()">✕</button>');
      H.push('</div>');

      /* GRID DOS COLUMNAS */
      H.push('<div class="loan-grid">');

      /* COLUMNA IZQUIERDA */
      H.push('<div class="loan-col">');

      /* Card Resumen */
      H.push('<div class="card card-anim" style="animation-delay:.10s">');
      H.push('<div class="card-title">Resumen del Préstamo</div>');
      H.push('<div class="kpi-grid">');
      H.push('<div class="kpi"><div class="kl">Capital prestado ' + tip('Monto total desembolsado originalmente en dólares.') + '</div><div class="kv">' + fmt(L.Loan_Amount_USD) + '</div><div class="ks">Tasa: ' + Number(L.Interest_Rate_Percent).toFixed(2) + '% anual ' + tip('Tasa de interés simple anual acordada.') + '</div></div>');
      H.push('<div class="kpi"><div class="kl">Total adeudado ' + tip('Suma de capital prestado más los intereses al vencimiento.') + '</div><div class="kv">' + fmt(L.Total_Amount_Due_USD) + '</div><div class="ks">Pendiente: ' + fmt(C.Remaining_USD) + '</div></div>');
      H.push('</div>');
      H.push('<div class="prog-wrap">');
      H.push('<div class="prog-label"><span>Progreso de Pagos</span><span style="color:var(--accent)">' + fmt(L.Total_Amount_Paid_USD) + ' / ' + fmt(L.Total_Amount_Due_USD) + '</span></div>');
      H.push('<div class="prog-bg"><div id="progFill" class="prog-fill"></div></div>');
      H.push('</div>');
      H.push('<div class="badges-row"><span class="badge">Inicio: ' + esc(L.Loan_Start_Date || '-') + '</span><span class="badge right">Vencimiento: ' + esc(L.Loan_Due_Date || '-') + '</span></div>');
      H.push('</div>');

      /* Card Historial */
      H.push('<div class="card card-anim" style="animation-delay:.15s">');
      H.push('<div class="card-title">Historial de Pagos</div>');
      H.push(P.length ? paymentsHtml(P) : emptyState());
      H.push('</div>');

      H.push('</div>'); /* fin col izq */

      /* COLUMNA DERECHA */
      H.push('<div class="loan-col">');
      H.push('<div class="card card-anim" style="animation-delay:.12s">');
      H.push('<div class="card-title">Monitoreo de Garantía BTC</div>');
      H.push('<div class="btc-grid">');

      /* Badge estado de riesgo */
      var riskDotClass = 'safe', riskTitle = 'Estado: Zona Segura', riskSub = 'El precio de la garantía cubre óptimamente el préstamo.';
      if (live <= warn && live > liq) { riskDotClass = 'warning'; riskTitle = 'Estado: Zona de Advertencia'; riskSub = 'El precio se aproxima al límite de seguridad.'; }
      if (live <= liq) { riskDotClass = 'danger'; riskTitle = 'Estado: Zona de Liquidación'; riskSub = 'Garantía en riesgo imminente de ejecución.'; }
      H.push('<div class="risk-badge">');
      H.push('<div style="display:flex;align-items:center;"><span class="risk-dot ' + riskDotClass + '"></span><span class="risk-title">' + riskTitle + '</span></div>');
      H.push('<div class="risk-sub">' + riskSub + '</div>');
      H.push('</div>');

      H.push('<div class="btc-card"><div class="bl">Garantía ' + tip('Cantidad de Bitcoin custodiada.', 'tip-right') + '</div><div class="bv">' + esc((Number(L.BTC_Collateral) || 0).toFixed(6).replace('.', ',')) + ' BTC</div></div>');
      H.push('<div class="btc-card"><div class="bl">Precio Inicial ' + tip('Precio de referencia al firmar el contrato.') + '</div><div class="bv">' + fmt(L.BTC_Initial_Price_USD) + '</div></div>');
      H.push('<div class="btc-card"><div class="bl">Precio Advertencia ' + tip('Nivel de precio que activa notificaciones preventivas.', 'tip-right') + '</div><div class="bv c-yellow">' + fmt(L.BTC_Warning_Price_USD) + '</div></div>');
      H.push('<div class="btc-card"><div class="bl">Precio Liquidación ' + tip('Umbral de cierre de posición por resguardo.', 'tip-left') + '</div><div class="bv c-red">' + fmt(L.BTC_Sell_Threshold_USD) + '</div></div>');
      H.push('<div class="btc-card full live"><div class="bl"><span class="live-dot ' + dotClass + '"></span>Precio BTC en vivo · ' + semLabel + ' ' + tip('Cotización de mercado en tiempo real.') + '</div>');
      H.push('<div class="bv ' + liveClass + '"><a href="https://coinmarketcap.com/es/currencies/bitcoin/" target="_blank" style="color:inherit;">' + fmt(L.BTC_Price_RealTime_USD) + '</a></div></div>');

      H.push('</div>'); /* fin btc-grid */
      H.push('</div>'); /* fin card BTC */
      H.push('</div>'); /* fin col der */
      H.push('</div>'); /* fin loan-grid */

      /* SPARKLINE CHART */
      H.push('<div class="card sparkline-card card-anim" style="animation-delay:.20s">');
      H.push('<div class="sparkline-header">');
      H.push('<div class="sparkline-title">📈 Evolución de BTC — ÚLTIMOS 30 DÍAS ' + tip('Gráfico de precio histórico reciente con tus límites de garantía trazados.') + '</div>');
      H.push('<div class="sparkline-legend"><div class="spark-leg"><div class="spark-leg-line" style="background:var(--accent)"></div>Advertencia</div><div class="spark-leg"><div class="spark-leg-line" style="background:#E11D48"></div>Liquidación</div></div>');
      H.push('</div><div id="sparklineChart"><div class="spark-loading">Obteniendo gráfico de mercado...</div></div></div>');

      result.innerHTML = H.join('');

      /* Animación de barra */
      setTimeout(() => {
        const fill = document.getElementById('progFill');
        if (fill) fill.style.width = pct + '%';
      }, 200);

      loadSparkline(warn, liq);
    }

    function emptyState() {
      return '<div class="empty-state">' +
        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.4;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>' +
        '<div class="empty-title">Sin pagos registrados aún</div>' +
        '<div class="empty-sub">Tus cuotas abonadas aparecerán listadas en este panel con su comprobante correspondiente.</div>' +
      '</div>';
    }

    function paymentsHtml(P) {
      var rows = P.map(function(p) {
        return '<tr><td>' + esc(p.Date) + '</td><td style="font-family:\'Plus Jakarta Sans\',sans-serif;font-weight:600;">' + fmt(p.Amount_USD) + '</td><td>' + esc(p.Notes || '-') + '</td><td class="td-muted">' + esc(p.Payment_ID || '-') + '</td></tr>';
      }).join('');
      return '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Monto</th><th>Detalle</th><th>ID Pago</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    function loadSparkline(warnPrice, liqPrice) {
      fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=30&interval=daily')
        .then(r => r.json())
        .then(data => { renderSparkline(data.prices.map(p => p[1]), warnPrice, liqPrice); })
        .catch(() => {
          const el = document.getElementById('sparklineChart');
          if (el) el.innerHTML = '<div class="spark-loading">Gráfico temporalmente no disponible.</div>';
        });
    }

    function renderSparkline(prices, warnPrice, liqPrice) {
      const el = document.getElementById('sparklineChart');
      if (!el || !prices.length) return;
      const W = el.getBoundingClientRect().width || 700;
      const H = 140, pad = { t: 14, b: 26, l: 10, r: 10 };
      const w = W - pad.l - pad.r, h = H - pad.t - pad.b;
      const minP = Math.min(...prices, liqPrice * 0.97);
      const maxP = Math.max(...prices, warnPrice * 1.03);
      const sx = i => (i / (prices.length - 1)) * w + pad.l;
      const sy = v => H - pad.b - ((v - minP) / (maxP - minP)) * h;
      const pts = prices.map((p, i) => sx(i) + ',' + sy(p)).join(' ');
      const areaPath = sx(0) + ',' + sy(prices[0]) + ' ' + pts.split(' ').slice(1).join(' ') + ' ' + sx(prices.length - 1) + ',' + (H - pad.b) + ' ' + sx(0) + ',' + (H - pad.b);
      const lastX = sx(prices.length - 1), lastY = sy(prices[prices.length - 1]);
      const yWarn = sy(warnPrice), yLiq = sy(liqPrice);
      const fmtK = v => v >= 1000 ? '$' + (v / 1000).toFixed(0) + 'k' : '$' + v.toFixed(0);
      const lineColor = '#D97706';

      el.innerHTML = `<svg class="spark-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${lineColor}" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="${lineColor}" stop-opacity="0"/>
        </linearGradient></defs>
        <polygon points="${areaPath}" fill="url(#sg)"/>
        ${warnPrice > minP && warnPrice < maxP ? `<line x1="${pad.l}" y1="${yWarn}" x2="${W - pad.r}" y2="${yWarn}" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4,3" opacity=".8"/><text x="${W - pad.r - 2}" y="${yWarn - 4}" fill="#D97706" font-size="9" font-weight="600" text-anchor="end" font-family="Plus Jakarta Sans,sans-serif">${fmtK(warnPrice)}</text>` : ''}
        ${liqPrice > minP && liqPrice < maxP ? `<line x1="${pad.l}" y1="${yLiq}" x2="${W - pad.r}" y2="${yLiq}" stroke="#E11D48" stroke-width="1.2" stroke-dasharray="4,3" opacity=".8"/><text x="${W - pad.r - 2}" y="${yLiq - 4}" fill="#E11D48" font-size="9" font-weight="600" text-anchor="end" font-family="Plus Jakarta Sans,sans-serif">${fmtK(liqPrice)}</text>` : ''}
        <polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${lastX}" cy="${lastY}" r="4" fill="${lineColor}" stroke="#FFFFFF" stroke-width="1.5"/>
        <text x="${pad.l}" y="${H - pad.b + 14}" fill="var(--text-muted)" font-size="9" font-family="Plus Jakarta Sans,sans-serif">${fmtK(minP)}</text>
        <text x="${pad.l}" y="${pad.t + 6}" fill="var(--text-muted)" font-size="9" font-family="Plus Jakarta Sans,sans-serif">${fmtK(maxP)}</text>
      </svg>`;
    }

    function resetView() {
      document.getElementById('searchScreen').style.display = 'block';
      document.getElementById('loanResult').style.display = 'none';
      document.getElementById('loanResult').innerHTML = '';
      document.getElementById('loanCode').value = '';
      document.getElementById('statusMsg').innerHTML = '';
      window._lastLoan = null;
    }
  </script>
</body>
</html>
